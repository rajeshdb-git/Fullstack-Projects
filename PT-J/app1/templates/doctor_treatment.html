{% extends 'base.html' %}

{% block content %}

<section class="doctor-treatment-page">
    <h1>Doctor Treatment</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit">Save Treatment</button>
    </form>
</section>

{% endblock %}
