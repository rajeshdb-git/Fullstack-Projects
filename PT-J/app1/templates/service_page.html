{% extends 'base.html' %}

{% block content %}

<section class="service-page">

    <h1>{{ service_name }}</h1>

    <p>
        Professional physiotherapy treatment for
        {{ service_name }}.
    </p>

    <form method="post" class="patient-form">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="patient-form-field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit" class="patient-form-submit">Submit</button>
    </form>

</section>

{% endblock %}
